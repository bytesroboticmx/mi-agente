[project]
name = "mi-agente"
version = "0.1.0"
description = "Agente CLI inteligente para terminal Linux"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dr. Aldo Gonzalez Vazquez", email = "bytesroboticmx@gmail.com"}]
dependencies = [
    "typer[all]>=0.12",
    "openai>=1.30",
    "anthropic>=0.25",
    "pydantic>=2.7",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mi-agente = "mi_agente.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "PT", "T20", "W", "N", "S", "RET", "TRY", "FURB", "LOG", "PL", "PLE", "PLR", "PTH", "ERA", "PD", "PGH", "TCH", "TID", "ARG", "FA", "FBT", "FURB", "ISC", "ICN", "PIE", "TID", "TRY"]
lint.ignore = [
    "S101",
    "PLR0913",
    "PLR0917",
    "TRY003",
    "T201",
    "T203",
    # Parámetros booleanos y argumentos usados por el framework CLI / kwargs
    "FBT001",
    "FBT002",
    "FBT003",
    "ARG001",
    "ARG002",
    # Imports perezosos deliberados (evitar dependencias opcionales/circularidad)
    "PLC0415",
    # Valores "mágicos" aceptados en configuración y umbrales
    "PLR2004",
    "TRY300",
    # Manejo de errores best-effort (historial, archivos binarios)
    "S110",
    "S112",
    # subprocess con shell=True es intencional en la herramienta `shell`
    "S602",
    "S603",
    "S607",
]
format.quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT011", "S105", "S106", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
