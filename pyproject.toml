[project]
name = "mi-agente"
version = "0.1.0"
description = "Agente CLI inteligente para terminal Linux"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tu Nombre", email = "tu@email.com"}]
dependencies = [
    "typer[all]>=0.12",
    "openai>=1.30",
    "anthropic>=0.25",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "ruff>=0.4",
    "mypy>=1.10",
]
ollama = ["ollama>=0.3"]

[project.scripts]
mi-agente = "mi_agente.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "B", "C4", "PT", "T20", "W", "N", "S", "RET", "TRY", "FURB", "LOG", "PL", "PLE", "PLR", "PTH", "ERA", "PD", "PGH", "TCH", "TID", "ARG", "FA", "FBT", "FURB", "ISC", "ICN", "PIE", "TID", "TRY"]
lint.ignore = ["S101", "PLR0913", "PLR0917", "TRY003", "T201", "T203"]
format.quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]